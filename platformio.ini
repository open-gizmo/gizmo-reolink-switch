[platformio]
extra_configs = platformio_secrets.ini
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
build_src_flags = -Wformat ; Check printf-style format strings against their arguments in our own code
monitor_speed = 115200
lib_deps = 
	bblanchon/ArduinoJson @ 7.2.2
	duinoWitchery/hd44780 @ 1.3.2
	https://github.com/open-gizmo/gizmo-common.git#v2.0.0

; Host tests for the hardware-free logic (run with: pio test -e native)
[env:native]
platform = native @ 1.2.1
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<menu/> +<config/> +<channels/>
build_flags =
	-std=gnu++17
	-I test/stubs
lib_deps =
	throwtheswitch/Unity @ 2.6.1
	https://github.com/open-gizmo/gizmo-common.git#v2.0.0
