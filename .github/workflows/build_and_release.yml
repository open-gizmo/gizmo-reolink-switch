name: Build & Release 📦

on:
  workflow_dispatch:

# The only lines that differ between the OpenGizmo gadgets: the rest of this file is the same in every one of them
env:
  GIZMO_NAME: Gizmo Reolink Switch
  GIZMO_SLUG: gizmo-reolink-switch
  CHIP_FAMILY: ESP32-S3
  ESPTOOL_CHIP: esp32s3
  BOOTLOADER_OFFSET: '0x0'

jobs:
  build-and-release:
    name: Build & Release 📦
    # Release only from main (the release goes live on the website flasher)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checkout repository (with tags, to check the version is new)
      - name: 🚚 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Read the version to release from the VERSION file (semantic versioning: MAJOR.MINOR.PATCH), and stop if it is not new or does not match the web app
      - name: 🏷️ Read version
        id: version
        run: |
          VERSION="v$(tr -d '[:space:]' < VERSION)"
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must be MAJOR.MINOR.PATCH (for example 1.0.0), not ${VERSION#v}."
            exit 1
          fi
          WEBAPP_VERSION=$(node -p "require('./webapp/package.json').version")
          if [ "v$WEBAPP_VERSION" != "$VERSION" ]; then
            echo "webapp/package.json version ($WEBAPP_VERSION) does not match VERSION (${VERSION#v})."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "$VERSION is already released: bump VERSION (and webapp/package.json) first."
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # Stop before anything is built or released if CHANGELOG.md has no notes for this version: they become the body of the GitHub release
      - name: 📝 Read the release notes
        run: python3 .github/scripts/release_notes.py --version "${{ steps.version.outputs.VERSION }}" --output release-notes.md

      # Stop before anything is released if the R2 secrets are missing: the upload comes last, after the version is tagged, and a tagged version can't be released again
      - name: 🔑 Check the R2 secrets
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "The $name secret is missing: add it to the repository or the organization (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done

      # Set up Node.js
      - name: 🧰 Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # Install dependencies for webapp
      - name: 📦 Install webapp dependencies
        working-directory: webapp
        run: npm ci

      # Build the embedded assets for the webapp
      - name: 🏗️ Build embedded web assets
        working-directory: webapp
        run: npm run build:embedded

      # Set up Python
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install PlatformIO
      - name: ⚙️ Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.2.0
      
      # Download the firmware libraries (the webapp tests read the error IDs of gizmo-common)
      - name: 📥 Install firmware libraries
        working-directory: microcontroller
        run: pio pkg install -e release

      # Run the webapp tests
      - name: 🧪 Run webapp tests
        working-directory: webapp
        run: npm test

      # Run the native tests before building
      - name: 🧪 Run native tests
        working-directory: microcontroller
        run: pio test -e native

      # Build the firmware (its version comes from the VERSION file, through microcontroller/firmware_version.py)
      - name: 🛠️ Build Firmware
        working-directory: microcontroller
        run: pio run -e release

      # Package the flash parts (bootloader, partition table, boot_app0, app) and the manifest of the browser flasher
      - name: 🗂️ Package firmware
        run: python .github/scripts/package_firmware.py --project-dir microcontroller --name "$GIZMO_NAME" --version "${{ steps.version.outputs.VERSION }}" --output-dir dist --build "release:$CHIP_FAMILY"

      # Write the body of the release: the notes of CHANGELOG.md, then how to flash it
      - name: 🗒️ Write the release body
        run: |
          cat >> release-notes.md <<'EOF'

          ---

          Built from commit ${{ github.sha }}.

          Flash it from the browser on https://opengizmo.dev/projects/${{ env.GIZMO_SLUG }}, or over USB:

          ```bash
          esptool.py --chip ${{ env.ESPTOOL_CHIP }} write_flash ${{ env.BOOTLOADER_OFFSET }} release-bootloader.bin 0x8000 release-partitions.bin 0xe000 release-boot_app0.bin 0x10000 release-firmware.bin
          ```
          EOF

      # Create a GitHub release with the flash parts
      - name: 📦 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ env.GIZMO_NAME }} ${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/${{ steps.version.outputs.VERSION }}/*.bin
            dist/debug/*.elf
          draft: false
          prerelease: false

      # Upload the parts and the manifest to R2, where the website flasher downloads them (last, so the website only offers a released version)
      - name: ☁️ Upload firmware to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required # R2 refuses some checksums the AWS CLI sends by default
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # The parts of a version never change, so they can be cached for ever
          aws s3 cp "dist/$VERSION" "s3://$R2_BUCKET/$GIZMO_SLUG/$VERSION" --recursive --endpoint-url "$R2_ENDPOINT" --cache-control "public, max-age=31536000, immutable" --content-type application/octet-stream

          # The manifest points the flasher to the new version, so it goes last and is cached for a minute only (the website offers the release within a minute, with no CDN purge)
          aws s3 cp dist/manifest.json "s3://$R2_BUCKET/$GIZMO_SLUG/manifest.json" --endpoint-url "$R2_ENDPOINT" --cache-control "public, max-age=60" --content-type application/json
